<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found • Steve Luiting</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/steveknowswebdesign-favicon.png">
  
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Playfair+Display:wght@700&amp;display=swap');
    
    body {
      font-family: "Inter", system_ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    .heading-serif {
      font-family: "Playfair Display", Georgia, "Times New Roman", serif;
      font-weight: 700;
    }
  </style>
</head>
<body class="bg-white text-slate-900 antialiased min-h-screen flex flex-col">

  <!-- Minimal header -->
  <div class="border-b border-slate-100">
    <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="/" class="font-semibold text-2xl tracking-tighter">Steve Luiting <span class="text-xs font-mono uppercase tracking-[2px] text-slate-400 ml-1.5">Denver</span></a>
      <a href="/" class="hidden sm:inline text-sm font-medium text-slate-600 hover:text-slate-900 transition">Back home</a>
    </div>
  </div>

  <main class="flex-1 flex items-center py-12 md:py-16">
    <div class="max-w-5xl mx-auto px-6 w-full">
      <div class="grid md:grid-cols-5 gap-x-10 gap-y-10 items-center">
        
        <!-- Sasquatch illustration -->
        <div class="md:col-span-3 order-2 md:order-1">
          <img 
            src="/assets/images/sasquatch-404.jpg" 
            alt="A cool, professional illustration of a sasquatch standing against a pure white background"
            class="w-full max-w-[520px] mx-auto md:mx-0 rounded-3xl border border-slate-100" />
        </div>

        <!-- Text content -->
        <div class="md:col-span-2 order-1 md:order-2 space-y-7">
          <div>
            <div class="heading-serif text-[92px] md:text-[120px] leading-[0.85] tracking-[-5.5px] text-slate-900">404</div>
          </div>

          <div class="space-y-4">
            <h1 class="heading-serif text-4xl md:text-[42px] tracking-[-1.5px] leading-none">The sasquatch<br>took that page.</h1>
            <p class="text-[15.5px] leading-relaxed text-slate-600 max-w-md">
              We looked everywhere. Even checked the woods. This one appears to have gone missing on the trail.
            </p>
          </div>

          <div class="pt-3 flex flex-col sm:flex-row gap-3">
            <a href="/" 
               class="inline-flex items-center justify-center gap-x-2 px-8 h-12 rounded-2xl bg-slate-900 text-white text-sm font-semibold hover:bg-black active:bg-slate-950 transition">
              Back to the trail
            </a>
            <a href="/blog/" 
               class="inline-flex items-center justify-center gap-x-2 px-8 h-12 rounded-2xl border border-slate-300 text-slate-700 text-sm font-medium hover:bg-slate-50 active:bg-slate-100 transition">
              Read the Notes
            </a>
          </div>

          <div class="text-sm text-slate-500">
            Or <a href="/#contact" class="text-slate-600 hover:text-slate-900 underline decoration-slate-300 hover:decoration-slate-400 transition">let's talk about your next project</a>.
          </div>
        </div>

      </div>
    </div>
  </main>

  <footer class="mt-auto py-8 border-t border-slate-100">
    <div class="max-w-6xl mx-auto px-6 text-center text-xs text-slate-400 tracking-wide">
      © Steve Luiting • Denver, Colorado
    </div>
  </footer>

</body>
</html>
