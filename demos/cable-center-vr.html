    .status { position: fixed; top: 50px; left: 16px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 3px; font-size: 12px; z-index: 100; }
    #ui {
      position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
      color: white; font-family: Arial, sans-serif; z-index: 100; text-align: center;
      background: rgba(0,0,0,0.75); padding: 12px 20px; border-radius: 10px;

    #ui button {
      padding: 10px 22px; font-size: 16px; cursor: pointer;
      background: #ff3366; color: white; border: none; border-radius: 8px; margin: 5px;
    }
  </style>
</head>

      <a-entity id="sphere2" class="clickable"
                geometry="primitive: sphere; radius: 0.8; segmentsWidth: 64; segmentsHeight: 64"
                material="src: #preview2; side: double; shader: flat"
                position="11 0.6 -17"
                animation__float="property: position; from: 11 0.6 -17; to: 0 1.9 4; dur: 3600; easing: easeOutCubic; delay: 300"
                animation="property: rotation; to: 0 360 0; dur: 19000; loop: true; easing: linear"
                shadow="cast: true; receive: true"></a-entity>

      <a-entity id="sphere3" class="clickable"
                geometry="primitive: sphere; radius: 0.75; segmentsWidth: 64; segmentsHeight: 64"
                material="src: #preview3; side: double; shader: flat"

                animation__float="property: position; from: 8 0.4 -19; to: 3.5 1.8 3; dur: 4100; easing: easeOutCubic; delay: 800"
                animation="property: rotation; to: 0 360 0; dur: 17000; loop: true; easing: linear"

    <!-- Scene-level video sphere: must NOT be a camera child or it rotates with look-controls and drag appears broken -->
    <a-videosphere id="main-video-sphere"
                   radius="5000"
                   segments-height="64"
                   segments-width="128"
                   visible="false"
                   material="shader: flat; side: back; depthWrite: false; depthTest: false; fog: false; toneMapped: false"></a-videosphere>

    <a-entity id="player"
              camera
              look-controls="reverseMouseDrag: true; pointerLockEnabled: false"
              player-locomotion="fly: true; speed: 8; minHeight: 0.99"
              position="-20 1.6 28">
      <a-cursor id="player-cursor" raycaster="objects: .clickable" color="#ffffff" opacity="0.7"></a-cursor>

  <script>
    const BUILDING_MODEL = '../assets/models/scene/scene.gltf';

    const colliderSystem = {
      boxes: [],
      floorY: 0.99,
      radius: 0.45,
      debug: new URLSearchParams(window.location.search).has('debugColliders'),
      tmpBox: new THREE.Box3(),
      tmpVec: new THREE.Vector3(),
      tmpVec2: new THREE.Vector3(),

      refreshFromModel(modelEl) {
        this.boxes = [];
        modelEl.object3D.updateWorldMatrix(true, true);
        modelEl.object3D.traverse((child) => {
          if (!child.name || !child.name.startsWith('COLLIDER_') || child.name === 'COLLIDER_Root') return;
          if (!child.isMesh) return;
          child.visible = this.debug;
          if (this.debug && child.material) {
            child.material = child.material.clone();
            child.material.color.set(0x00ff88);
            child.material.opacity = 0.25;
            child.material.transparent = true;
            child.material.depthWrite = false;
          }
          this.tmpBox.setFromObject(child);
          const entry = {
            name: child.name,
            min: this.tmpBox.min.clone(),
            max: this.tmpBox.max.clone(),
            isFloor: child.name === 'COLLIDER_Floor'
          };
          this.boxes.push(entry);
          if (entry.isFloor) this.floorY = entry.max.y + 0.05;
        });
        console.log('[Cable Center] Colliders loaded:', this.boxes.map((b) => b.name));
      },

      sphereHitsBox(pos, box, radius) {
        this.tmpVec.set(
          THREE.MathUtils.clamp(pos.x, box.min.x, box.max.x),
          THREE.MathUtils.clamp(pos.y, box.min.y, box.max.y),
          THREE.MathUtils.clamp(pos.z, box.min.z, box.max.z)
        );
        return this.tmpVec.distanceToSquared(pos) < radius * radius;
      },

      hitsAny(pos, radius) {
        for (const box of this.boxes) {
          if (box.isFloor) continue; // vertical floor clamp only, not a movement wall
          if (this.sphereHitsBox(pos, box, radius)) return true;
        }
        return false;
      },

      resolveMove(from, move, allowVertical) {
        const radius = this.radius;
        if (!this.boxes.length) {
          this.tmpVec.copy(from).add(move);
          return this.tmpVec;
        }

        this.tmpVec.copy(from).add(move);
        if (!this.hitsAny(this.tmpVec, radius)) return this.tmpVec;

        this.tmpVec2.copy(from);
        this.tmpVec2.x += move.x;
        if (!this.hitsAny(this.tmpVec2, radius)) return this.tmpVec2;

        this.tmpVec2.copy(from);
        this.tmpVec2.z += move.z;
        if (!this.hitsAny(this.tmpVec2, radius)) return this.tmpVec2;

        if (allowVertical && move.y) {
          this.tmpVec2.copy(from);
          this.tmpVec2.y += move.y;
          if (!this.hitsAny(this.tmpVec2, radius)) return this.tmpVec2;
        }

        return from;
      }
    };

    AFRAME.registerComponent('player-locomotion', {
      schema: {
        speed: { type: 'number', default: 8 },
        fly: { type: 'boolean', default: true },
        deadzone: { type: 'number', default: 0.12 },
        minHeight: { type: 'number', default: 0.99 }
      },
      init: function () {
        this.keys = Object.create(null);
        this.forward = new THREE.Vector3();
        this.right = new THREE.Vector3();
        this.move = new THREE.Vector3();
        this.up = new THREE.Vector3(0, 1, 0);
        this.active = false;
        this.moveKeys = new Set([
          'KeyW', 'KeyA', 'KeyS', 'KeyD',
          'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
          'Space', 'ShiftLeft', 'ShiftRight'
        ]);

        this.onKeyDown = (e) => {
          if (!this.moveKeys.has(e.code)) return;
          this.keys[e.code] = true;
          e.preventDefault();
        };
        this.onKeyUp = (e) => { this.keys[e.code] = false; };

        window.addEventListener('keydown', this.onKeyDown);
        window.addEventListener('keyup', this.onKeyUp);

        const scene = this.el.sceneEl;
        const activate = () => {
          this.active = true;
          const canvas = scene && scene.canvas;
          if (canvas) canvas.focus();
        };

        scene.addEventListener('loaded', () => {
          const canvas = scene.canvas;
          if (!canvas) return;
          canvas.setAttribute('tabindex', '0');
          canvas.style.outline = 'none';
          canvas.addEventListener('pointerdown', activate);
          activate();
        });
      },
      remove: function () {
        window.removeEventListener('keydown', this.onKeyDown);
        window.removeEventListener('keyup', this.onKeyUp);
      },
      getGamepad: function (hand) {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        const handMatch = hand === 'left' ? /left/i : /right/i;
        for (const gp of gamepads) {
          if (!gp || !gp.connected) continue;
          if (handMatch.test(gp.id || '')) return gp;
        }
        const index = hand === 'left' ? 0 : 1;
        return gamepads[index] && gamepads[index].connected ? gamepads[index] : null;
      },
      readStick: function (gamepad) {
        if (!gamepad || !gamepad.axes || gamepad.axes.length < 2) {
          return { x: 0, y: 0 };
        }
        let x = gamepad.axes[0] || 0;
        let y = gamepad.axes[1] || 0;
        if (Math.abs(x) < this.data.deadzone) x = 0;
        if (Math.abs(y) < this.data.deadzone) y = 0;
        return { x, y };
      },
      applyMove: function (forwardAmt, strafeAmt, verticalAmt, dt, horizontalOnly) {
        const obj = this.el.object3D;
        obj.getWorldDirection(this.forward);
        // Keyboard WASD: always move on the ground plane (ignore camera pitch).
        if (!this.data.fly || horizontalOnly) this.forward.y = 0;
        if (this.forward.lengthSq() < 1e-6) {
          const yaw = this.el.object3D.rotation.y;
          this.forward.set(-Math.sin(yaw), 0, -Math.cos(yaw));
        }
        this.forward.normalize();
        this.right.crossVectors(this.forward, this.up).normalize();

        this.move.set(0, 0, 0);
        this.move.addScaledVector(this.forward, forwardAmt * this.data.speed * dt);
        this.move.addScaledVector(this.right, strafeAmt * this.data.speed * dt);
        if (this.data.fly) this.move.y += verticalAmt * this.data.speed * dt;

        const resolved = colliderSystem.resolveMove(obj.position, this.move, this.data.fly);
        obj.position.copy(resolved);

        const floorY = Math.max(colliderSystem.floorY, this.data.minHeight);
        if (obj.position.y < floorY) obj.position.y = floorY;
      },
      tick: function (time, delta) {
        const scene = this.el.sceneEl;
        if (!scene) return;
        const dt = Math.min(delta, 50) / 1000;

        if (scene.is('vr-mode')) {
          const left = this.readStick(this.getGamepad('left'));
          const right = this.readStick(this.getGamepad('right'));
          if (!left.x && !left.y && !right.y) return;
          this.applyMove(-left.y, left.x, this.data.fly ? -right.y : 0, dt, false);
          return;
        }

        if (!this.active) return;

        const w = this.keys.KeyW || this.keys.ArrowUp;
        const s = this.keys.KeyS || this.keys.ArrowDown;
        const a = this.keys.KeyA || this.keys.ArrowLeft;
        const d = this.keys.KeyD || this.keys.ArrowRight;
        const rise = this.keys.Space;
        const fall = this.keys.ShiftLeft || this.keys.ShiftRight;
        if (!w && !s && !a && !d && !rise && !fall) return;

        let forwardAmt = 0;
        let strafeAmt = 0;
        let verticalAmt = 0;
        if (w) forwardAmt -= 1;
        if (s) forwardAmt += 1;
        if (a) strafeAmt -= 1;
        if (d) strafeAmt += 1;
        if (this.data.fly && rise) verticalAmt += 1;
        if (this.data.fly && fall) verticalAmt -= 1;
        this.applyMove(forwardAmt, strafeAmt, verticalAmt, dt, true);
      }
    });

    const statusEl = document.getElementById('status');
    const model = document.getElementById('model');
    const player = document.getElementById('player');
    const mainWrapper = document.getElementById('main-scene-wrapper');
    const videoSphere = document.getElementById('main-video-sphere');
    const sceneEl = document.getElementById('main-scene');
    const ui = document.getElementById('ui');
    const muteBtn = document.getElementById('mute-btn');
    const restartBtn = document.getElementById('restart-btn');
    const playerCursor = document.getElementById('player-cursor');

    let sceneFog = null;
    let activeVideoId = null;
    let initialPlayerPosition = null;
    let initialPlayerRotation = null;
    const walkthroughIds = ['model', 'environment', 'clouds', 'sphere1', 'sphere2', 'sphere3'];
    const WALKTHROUGH_BG = 'color: #87CEEB';
    const VIDEO_BG = 'color: #000000';
    const sphereConfigs = {
      sphere1: {
        position: '9 0.5 -15',
        float: 'property: position; from: 9 0.5 -15; to: -3.5 1.8 -3; dur: 3400; easing: easeOutCubic',
        spin: 'property: rotation; to: 0 360 0; dur: 18000; loop: true; easing: linear'
      },
      sphere2: {
        position: '11 0.6 -17',
        float: 'property: position; from: 11 0.6 -17; to: 0 1.9 -3.5; dur: 3600; easing: easeOutCubic; delay: 300',
        spin: 'property: rotation; to: 0 360 0; dur: 19000; loop: true; easing: linear'
      },
      sphere3: {
        position: '8 0.4 -19',
        float: 'property: position; from: 8 0.4 -19; to: 3.5 1.8 -3; dur: 4100; easing: easeOutCubic; delay: 800',
        spin: 'property: rotation; to: 0 360 0; dur: 17000; loop: true; easing: linear'
      }
    };

    function setWalkthroughVisible(visible) {
      mainWrapper.setAttribute('visible', visible);
      walkthroughIds.forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.setAttribute('visible', visible);
      });
      mainWrapper.querySelectorAll('a-light').forEach((el) => el.setAttribute('visible', visible));
    }

    function setVideoLookMode(enabled) {
      if (enabled) {
        sceneEl.removeAttribute('cursor');
        sceneEl.setAttribute('raycaster', 'objects: .none');
        playerCursor.setAttribute('visible', false);
        player.setAttribute('look-controls', 'reverseMouseDrag: true; pointerLockEnabled: false; enabled: true');
        sceneEl.canvas.focus();
      } else {
        sceneEl.setAttribute('cursor', 'rayOrigin: mouse');
        sceneEl.setAttribute('raycaster', 'objects: .clickable');
        playerCursor.setAttribute('visible', true);
      }
    }

    function centerVideoSphereOnPlayer() {
      const worldPos = new THREE.Vector3();
      player.object3D.getWorldPosition(worldPos);
      videoSphere.object3D.position.copy(worldPos);
    }

    function isColliderMesh(child) {
      return child.name && child.name.startsWith('COLLIDER_');
    }

    // Model was authored with sub-grade props below the visible landscape slab.
    function findLandscapeGroundY(el) {
      let best = null;
      el.object3D.traverse((child) => {
        if (!child.isMesh || isColliderMesh(child)) return;
        const box = new THREE.Box3().setFromObject(child);
        const height = box.max.y - box.min.y;
        const width = box.max.x - box.min.x;
        const depth = box.max.z - box.min.z;
        if (height > 5 || (width < 1.5 && depth < 1.5)) return;
        if (best === null || box.min.y < best) best = box.min.y;
      });
      return best;
    }

    function centerAndGroundModel(el) {
      el.setAttribute('position', '0 0 0');
      el.setAttribute('rotation', '0 180 0');
      el.object3D.updateWorldMatrix(true, true);
      const fullBox = new THREE.Box3();
      const meshMinYs = [];
      el.object3D.traverse((child) => {
        if (!child.isMesh || isColliderMesh(child)) return;
        const box = new THREE.Box3().setFromObject(child);
        meshMinYs.push(box.min.y);
        fullBox.union(box);
      });
      if (!meshMinYs.length) return;

      const landscapeY = findLandscapeGroundY(el);
      const groundY = landscapeY !== null ? landscapeY : Math.min(...meshMinYs);

      const center = fullBox.getCenter(new THREE.Vector3());
      el.setAttribute('position', {
        x: -center.x,
        y: -groundY,
        z: -center.z
      });
      console.log('[Cable Center] Grounded to landscape Y:', groundY.toFixed(2));
    }

    function playVideo(videoId) {
      activeVideoId = videoId;
      const videoEl = document.querySelector(videoId);

      setWalkthroughVisible(false);
      setVideoLookMode(true);
      sceneEl.setAttribute('background', VIDEO_BG);

      // Environment fog (fogFar ~84) hides the huge video sphere — disable it during playback.
      sceneFog = sceneEl.object3D.fog;
      sceneEl.object3D.fog = null;

      centerVideoSphereOnPlayer();
      videoSphere.setAttribute('material', 'shader: flat; side: back; depthWrite: false; depthTest: false; fog: false; toneMapped: false');
      videoSphere.setAttribute('src', videoId);
      videoSphere.setAttribute('visible', true);

      // Must render above any leftover sky sphere (a-sky defaults to renderOrder 0).
      const mesh = videoSphere.getObject3D('mesh');
      if (mesh) mesh.renderOrder = 1;

      videoEl.currentTime = 0;
      videoEl.play().then(() => {
        statusEl.textContent = 'Playing 360° video — drag to look around, ESC to exit';
        ui.style.display = 'block';
        muteBtn.textContent = videoEl.muted ? '🔊 Unmute' : '🔇 Mute';
      }).catch((err) => {
        console.error('Video play failed:', err);
        statusEl.textContent = 'Click the 3D view, then click a sphere to play video.';
      });
    }

    function exitVideo() {
      if (activeVideoId) {
        const videoEl = document.querySelector(activeVideoId);
        if (videoEl) videoEl.pause();
      }

      videoSphere.setAttribute('visible', false);
      videoSphere.removeAttribute('src');
      const mesh = videoSphere.getObject3D('mesh');
      if (mesh) mesh.renderOrder = 0;
      activeVideoId = null;

      setWalkthroughVisible(true);
      setVideoLookMode(false);
      sceneEl.setAttribute('background', WALKTHROUGH_BG);
      sceneEl.object3D.fog = sceneFog;

      ui.style.display = 'none';
      statusEl.textContent = 'Click the 3D view, then WASD to move (Space/Shift up/down). Click a sphere for 360° video.';
    }

    function resetVideos() {
      ['#video1', '#video2', '#video3'].forEach((videoId) => {
        const videoEl = document.querySelector(videoId);
        if (!videoEl) return;
        videoEl.pause();
        videoEl.currentTime = 0;
        videoEl.muted = false;
      });
    }

    function resetPlayer() {
      if (!initialPlayerPosition) return;
      player.setAttribute('position', initialPlayerPosition);
      player.setAttribute('rotation', initialPlayerRotation);

      const lookControls = player.components['look-controls'];
      if (lookControls && lookControls.pitchObject && lookControls.yawObject) {
        lookControls.pitchObject.rotation.x = 0;
        lookControls.yawObject.rotation.y = THREE.MathUtils.degToRad(initialPlayerRotation.y || 0);
      }
    }

    function resetSpheres() {
      Object.entries(sphereConfigs).forEach(([id, config]) => {
        const sphere = document.getElementById(id);
        sphere.removeAttribute('animation__float');
        sphere.removeAttribute('animation__hover');
        sphere.removeAttribute('animation');
        sphere.setAttribute('visible', true);
        sphere.setAttribute('scale', '1 1 1');
        sphere.setAttribute('rotation', '0 0 0');
        sphere.setAttribute('position', config.position);
        sphere.setAttribute('animation__float', config.float);
        sphere.setAttribute('animation', config.spin);
      });
    }

    function restartExperience() {
      exitVideo();
      resetVideos();
      resetPlayer();
      resetSpheres();
      statusEl.textContent = 'Back in front of the spheres — click one to play 360° video.';
    }

    function onBuildingLoaded() {
      centerAndGroundModel(model);
      colliderSystem.refreshFromModel(model);
      statusEl.textContent = 'Click the 3D view, then WASD to move (Space/Shift up/down). Click a sphere for 360° video.';
      console.log('%c[Cable Center] glTF loaded:', BUILDING_MODEL, 'color:#22c55e');
    }

    model.addEventListener('model-loaded', onBuildingLoaded);
    model.addEventListener('model-error', (e) => {
      statusEl.textContent = 'Error loading model: ' + BUILDING_MODEL;
      console.error('glTF load error:', BUILDING_MODEL, e);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') exitVideo();
    });

    muteBtn.addEventListener('click', () => {
      if (!activeVideoId) return;
      const videoEl = document.querySelector(activeVideoId);
      if (!videoEl) return;
      videoEl.muted = !videoEl.muted;
      muteBtn.textContent = videoEl.muted ? '🔊 Unmute' : '🔇 Mute';
    });

    restartBtn.addEventListener('click', restartExperience);

    sceneEl.addEventListener('loaded', () => {
      const pos = player.getAttribute('position');
      const rot = player.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
      initialPlayerPosition = { x: pos.x, y: pos.y, z: pos.z };
      initialPlayerRotation = { x: rot.x, y: rot.y, z: rot.z };
      sceneFog = sceneEl.object3D.fog;
      console.log('✅ glTF walkthrough + 360 spheres ready');

      document.getElementById('sphere1').addEventListener('click', () => playVideo('#video1'));
      document.getElementById('sphere2').addEventListener('click', () => playVideo('#video2'));
      document.getElementById('sphere3').addEventListener('click', () => playVideo('#video3'));

      ['sphere1', 'sphere2', 'sphere3'].forEach((id) => {
        const sphere = document.getElementById(id);
        sphere.addEventListener('mouseenter', () => {
          sphere.setAttribute('animation__hover', { property: 'scale', to: '1.35 1.35 1.35', dur: 250 });
        });
        sphere.addEventListener('mouseleave', () => {
          sphere.setAttribute('animation__hover', { property: 'scale', to: '1 1 1', dur: 250 });
        });
      });
    });
  </script>
</body>
</html>
