<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Steve Luiting — 3D Lab</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
  <style>
    #hud-menu {
      position: fixed;
      bottom: 80px;
      right: 24px;
      z-index: 1000;
      display: none;
      pointer-events: none;
      filter: drop-shadow(0 8px 25px rgba(0, 0, 0, 0.5));
    }
    
    #hud-menu > div {
      pointer-events: auto;
      position: relative;
      width: 150px;
      height: 200px;
    }
    
    .hud-button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #2d2d44;
      cursor: pointer;
      transition: transform 0.2s;
      position: absolute;
      z-index: 1;
    }
    
    .hud-button:hover {
      transform: scale(1.2);
      z-index: 100;
    }
    
    .hud-button::after {
      content: attr(data-label);
      position: fixed;
      bottom: auto;
      left: auto;
      transform: none;
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      white-space: nowrap;
      font-size: 13px;
      font-weight: bold;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 10001;
      margin-top: -60px;
      margin-left: -30px;
    }
    
    .hud-button:hover::after {
      opacity: 1;
    }
    
    #hud-center {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #2d2d44;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      z-index: 1;
    }
    
    #hud-center:hover {
      transform: translate(-50%, -50%) scale(1.2);
      background: #4a4a66;
      z-index: 100;
    }
    
    #hud-center::after {
      content: 'Home';
      position: fixed;
      bottom: auto;
      left: auto;
      transform: none;
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      white-space: nowrap;
      font-size: 13px;
      font-weight: bold;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 10001;
      margin-top: -60px;
      margin-left: -15px;
    }
    
    .hud-button.fly-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .hud-button.fly-btn:hover {
      background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
    }
    
    #instruction-text {
      position: fixed;
      top: 52%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2000;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.5s;
      font-family: "Avenir Next", "Avenir", "Inter", system_ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    #instruction-text.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .top-brand-link {
      text-decoration: none;
      color: inherit;
      border-radius: 8px;
      transition: opacity 0.2s ease;
      cursor: pointer;
    }
    .top-brand-link:hover {
      opacity: 0.8;
    }
    .top-brand-link:hover img {
      transform: scale(1.08);
    }

    .top-brand-container {
      font-family: "Avenir Next", "Avenir", "Inter", system_ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <!-- Top Brand Bar -->
  <div style="position: fixed; top: 0; left: 0; right: 0; z-index: 2000; background: rgba(9,9,11,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.08);">
    <div class="top-brand-container" style="max-width: 1200px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;">
      <a href="#" 
         class="top-brand-link"
         onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;"
         aria-label="Back to top">
        <div style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit;">
          <div style="width: 28px; height: 28px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); transition: transform 0.2s;">
            <img src="profile.png" alt="Steve Luiting" style="width: 100%; height: 100%; object-cover;">
          </div>
          <div>
            <div style="color: #fff; font-weight: 600; font-size: 15px; letter-spacing: -0.2px;">Steve Luiting</div>
            <div style="color: #666; font-size: 10px; letter-spacing: 1px;">3D LAB</div>
          </div>
        </div>
      </a>
      
      <a href="index.html" class="top-brand-container" style="display: inline-flex; align-items: center; gap: 8px; color: #a1a1aa; text-decoration: none; font-size: 13px; padding: 6px 14px; border-radius: 9999px; border: 1px solid rgba(255,255,255,0.1); transition: all 0.2s;">
        <span style="font-size: 11px;">←</span> 
        <span>Back to Portfolio</span>
      </a>
    </div>
  </div>

  <!-- Instruction Text -->
  <div id="instruction-text">
    <div style="background: rgba(9, 9, 11, 0.9); padding: 22px 44px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08);">
      <p style="color: #fff; font-size: 15px; font-weight: 500; margin: 0; letter-spacing: -0.2px;">WASD or Arrow keys to move • Click to look around</p>
      <p style="color: #a1a1aa; font-size: 13px; margin: 8px 0 0 0;">Use the HUD on the right or the in-world menu to teleport between zones</p>
    </div>
  </div>

  <!-- 2D HUD Mini Menu -->
  <div id="hud-menu">
    <div style="position: relative; width: 150px; height: 150px;">
      <div id="hud-center"></div>
      <button class="hud-button" style="background: #FF6B6B; left: 55px; top: 0;" data-x="30" data-y="1.6" data-z="-40" data-label="Red Zone" data-zone="red"></button>
      <button class="hud-button" style="background: #4ECDC4; left: 10px; top: 25px;" data-x="-35" data-y="1.6" data-z="-35" data-label="Blue Zone" data-zone="blue"></button>
      <button class="hud-button" style="background: #7BC8A4; left: 10px; top: 85px;" data-x="0" data-y="1.6" data-z="-60" data-label="Green Zone" data-zone="green"></button>
      <button class="hud-button" style="background: #FFE66D; left: 100px; top: 85px;" data-x="40" data-y="1.6" data-z="35" data-label="Yellow Zone" data-zone="yellow"></button>
      <button class="hud-button" style="background: #FF6B9D; left: 100px; top: 25px;" data-x="-40" data-y="1.6" data-z="45" data-label="Purple Zone" data-zone="purple"></button>
      
      <!-- Flying positions -->
      <button class="hud-button fly-btn" style="background: #9C27B0; left: 55px; top: 160px;" data-x="50" data-y="20" data-z="-60" data-label="Mountain View" data-zone=""></button>
      <button class="hud-button fly-btn" style="background: #00BCD4; left: 100px; top: 160px;" data-x="0" data-y="25" data-z="0" data-label="Sky View" data-zone=""></button>
    </div>
  </div>
  
  <a-scene shadow="type: pcf; autoUpdate: true;">
    <!-- Assets -->
    <a-assets timeout="10000">
      <video id="video-screen" crossorigin="anonymous" loop muted playsinline webkit-playsinline autoplay
             src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4">
      </video>
    </a-assets>
    
    <!-- Sky with gradient -->
    <a-sky color="#87CEEB"></a-sky>
    
    <!-- Visible Sun -->
    <a-entity position="100 150 -80">
      <a-sphere radius="15" color="#FDB813" 
                material="shader: flat; color: #FDB813"></a-sphere>
      <!-- Sun glow effect -->
      <a-sphere radius="18" color="#FFD700" opacity="0.3" 
                material="shader: flat; color: #FFD700; transparent: true; opacity: 0.3"></a-sphere>
      <a-sphere radius="22" color="#FFEB3B" opacity="0.15" 
                material="shader: flat; color: #FFEB3B; transparent: true; opacity: 0.15"></a-sphere>
    </a-entity>
    
    <!-- Clouds - Improved with better grouping and variety -->
    <a-entity id="clouds">
      <!-- Cloud group 1 - Front left -->
      <a-entity position="20 22 -35" rotation="0 15 0">
        <a-sphere position="0 0 0" radius="6" color="#FFFFFF" opacity="0.8"></a-sphere>
        <a-sphere position="-4 1 2" radius="5" color="#FFFFFF" opacity="0.75"></a-sphere>
        <a-sphere position="4 -0.5 1" radius="5.5" color="#FFFFFF" opacity="0.78"></a-sphere>
        <a-sphere position="2 1.5 -2" radius="4.5" color="#FFFFFF" opacity="0.7"></a-sphere>
        <a-sphere position="-2 0.5 -1" radius="4" color="#F5F5F5" opacity="0.72"></a-sphere>
      </a-entity>
      
      <!-- Cloud group 2 - Back left -->
      <a-entity position="-30 28 -55" rotation="0 -25 0">
        <a-sphere position="0 0 0" radius="8" color="#FFFFFF" opacity="0.65"></a-sphere>
        <a-sphere position="-5 2 3" radius="7" color="#FFFFFF" opacity="0.6"></a-sphere>
        <a-sphere position="5 -1 2" radius="7.5" color="#FFFFFF" opacity="0.63"></a-sphere>
        <a-sphere position="3 2 -3" radius="6" color="#F8F8F8" opacity="0.58"></a-sphere>
      </a-entity>
      
      <!-- Cloud group 3 - Right side -->
      <a-entity position="45 25 15" rotation="0 40 0">
        <a-sphere position="0 0 0" radius="7" color="#FFFFFF" opacity="0.75"></a-sphere>
        <a-sphere position="-4.5 1.5 2.5" radius="6" color="#FFFFFF" opacity="0.7"></a-sphere>
        <a-sphere position="4.5 -0.5 1.5" radius="6.5" color="#FFFFFF" opacity="0.73"></a-sphere>
        <a-sphere position="2 2 -2" radius="5.5" color="#F5F5F5" opacity="0.68"></a-sphere>
      </a-entity>
      
      <!-- Cloud group 4 - Far back right -->
      <a-entity position="-50 32 45" rotation="0 -35 0">
        <a-sphere position="0 0 0" radius="9" color="#FFFFFF" opacity="0.55"></a-sphere>
        <a-sphere position="-6 2.5 4" radius="8" color="#FFFFFF" opacity="0.5"></a-sphere>
        <a-sphere position="6 -1 3" radius="8.5" color="#FAFAFA" opacity="0.53"></a-sphere>
        <a-sphere position="3 2.5 -3" radius="7" color="#F8F8F8" opacity="0.48"></a-sphere>
      </a-entity>
      
      <!-- Cloud group 5 - Center far -->
      <a-entity position="5 30 -70" rotation="0 10 0">
        <a-sphere position="0 0 0" radius="10" color="#FFFFFF" opacity="0.6"></a-sphere>
        <a-sphere position="-6 2 4" radius="8.5" color="#FFFFFF" opacity="0.55"></a-sphere>
        <a-sphere position="6 -1.5 3" radius="9" color="#FFFFFF" opacity="0.58"></a-sphere>
        <a-sphere position="3 2 -3.5" radius="7.5" color="#FAFAFA" opacity="0.52"></a-sphere>
      </a-entity>
      
      <!-- Small fluffy clouds scattered -->
      <a-entity position="-15 20 -20" rotation="0 20 0">
        <a-sphere position="0 0 0" radius="3.5" color="#FFFFFF" opacity="0.8"></a-sphere>
        <a-sphere position="-2 0.5 1" radius="3" color="#FFFFFF" opacity="0.75"></a-sphere>
        <a-sphere position="2 0.3 0.5" radius="3.2" color="#F8F8F8" opacity="0.78"></a-sphere>
      </a-entity>
      
      <a-entity position="35 24 -10" rotation="0 -15 0">
        <a-sphere position="0 0 0" radius="4" color="#FFFFFF" opacity="0.7"></a-sphere>
        <a-sphere position="-2.5 1 1.5" radius="3.5" color="#FFFFFF" opacity="0.65"></a-sphere>
        <a-sphere position="2.5 0.5 1" radius="3.8" color="#FAFAFA" opacity="0.68"></a-sphere>
      </a-entity>
    </a-entity>
    
    <!-- Low-poly terrain - main ground with seamless grass texture -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="200" height="200" 
             material="src: https://cdn.aframe.io/a-painter/images/floor.jpg; repeat: 20 20; color: #6db47d; roughness: 0.9; metalness: 0.1" 
             shadow="receive: true"></a-plane>
    
    <!-- Low-poly hills/terrain features -->
    <a-cone position="50 0 -60" radius-bottom="15" radius-top="0" height="20" color="#4a8e5f" 
            rotation="0 25 0" material="flatShading: true" shadow="cast: true; receive: true"></a-cone>
    <a-cone position="-55 0 -55" radius-bottom="18" radius-top="0" height="25" color="#4a8e5f" 
            rotation="0 -40 0" material="flatShading: true" shadow="cast: true; receive: true"></a-cone>
    <a-cone position="60 0 70" radius-bottom="20" radius-top="0" height="30" color="#4a8e5f" 
            rotation="0 60 0" material="flatShading: true" shadow="cast: true; receive: true"></a-cone>
    <a-cone position="-70 0 65" radius-bottom="16" radius-top="0" height="22" color="#4a8e5f" 
            rotation="0 -15 0" material="flatShading: true" shadow="cast: true; receive: true"></a-cone>
    
    <!-- Trees scattered around -->
    <a-cylinder position="30 1.5 -30" radius="0.5" height="3" color="#6b4423" shadow="cast: true; receive: true"></a-cylinder>
    <a-cone position="30 4 -30" radius-bottom="2" radius-top="0" height="4" color="#2d5016" shadow="cast: true"></a-cone>
    
    <a-cylinder position="-35 1.5 -25" radius="0.5" height="3" color="#6b4423" shadow="cast: true; receive: true"></a-cylinder>
    <a-cone position="-35 4 -25" radius-bottom="2" radius-top="0" height="4" color="#2d5016" shadow="cast: true"></a-cone>
    
    <a-cylinder position="45 1.5 40" radius="0.5" height="3" color="#6b4423" shadow="cast: true; receive: true"></a-cylinder>
    <a-cone position="45 4 40" radius-bottom="2" radius-top="0" height="4" color="#2d5016" shadow="cast: true"></a-cone>
    
    <a-cylinder position="-50 1.5 50" radius="0.5" height="3" color="#6b4423" shadow="cast: true; receive: true"></a-cylinder>
    <a-cone position="-50 4 50" radius-bottom="2" radius-top="0" height="4" color="#2d5016" shadow="cast: true"></a-cone>
    
    <a-cylinder position="25 1.5 55" radius="0.5" height="3" color="#6b4423" shadow="cast: true; receive: true"></a-cylinder>
    <a-cone position="25 4 55" radius-bottom="2" radius-top="0" height="4" color="#2d5016" shadow="cast: true"></a-cone>
    
    <!-- Mountain View Platform and Signage -->
    <a-entity position="50 20 -60">
      <!-- Platform -->
      <a-cylinder position="0 -0.5 0" radius="5" height="1" color="#8B4513"></a-cylinder>
      
      <!-- Signage -->
      <a-plane position="0 2 -4" width="6" height="2" color="#2a2a2a" opacity="0.9"></a-plane>
      <a-entity text="value: MOUNTAIN VIEW\nAltitude: 20m; color: #FFD700; align: center; width: 5" position="0 2 -3.9"></a-entity>
      
      <!-- Back Button -->
      <a-box class="clickable back-btn" position="0 1 2" width="2" height="0.8" depth="0.2" color="#4CAF50" data-x="0" data-y="1.6" data-z="0">
        <a-entity text="value: BACK TO\nGROUND; color: #FFF; align: center; width: 3" position="0 0 0.11"></a-entity>
      </a-box>
      
      <!-- Railing for safety feel -->
      <a-torus position="0 1 0" radius="4.5" radius-tubular="0.1" color="#8B4513"></a-torus>
    </a-entity>
    
    <!-- Sky View Platform and Signage -->
    <a-entity position="0 25 0">
      <!-- Platform -->
      <a-cylinder position="0 -0.5 0" radius="6" height="1" color="#4682B4"></a-cylinder>
      
      <!-- Signage -->
      <a-plane position="0 2 -5" width="7" height="2.5" color="#1a1a2a" opacity="0.9"></a-plane>
      <a-entity text="value: SKY VIEW\nAltitude: 25m\nBird's Eye View; color: #87CEEB; align: center; width: 6" position="0 2 -4.9"></a-entity>
      
      <!-- Back Button -->
      <a-box class="clickable back-btn" position="0 1 3" width="2.5" height="0.8" depth="0.2" color="#4CAF50" data-x="0" data-y="1.6" data-z="0">
        <a-entity text="value: RETURN TO\nGROUND; color: #FFF; align: center; width: 3.5" position="0 0 0.11"></a-entity>
      </a-box>
      
      <!-- Railing -->
      <a-torus position="0 1 0" radius="5.5" radius-tubular="0.1" color="#4682B4"></a-torus>
    </a-entity>
    
    <a-ring position="30 0.01 -40" rotation="-90 0 0" radius-inner="2" radius-outer="2.5" color="#FF6B6B"></a-ring>
    
    <!-- Red Zone Content: Text Panel with Info -->
    <a-entity id="red-content" position="30 2.5 -40" visible="false">
      <a-plane width="5" height="3" color="#1a1a1a" opacity="0.9"></a-plane>
      <a-entity text="value: RED ZONE\nWelcome Section; color: #FF6B6B; align: center; width: 4.5" position="0 0.8 0.01"></a-entity>
      <a-entity text="value: This could be your homepage\nor introduction area.\nAdd any content you need!; color: #FFF; align: center; width: 4.5" position="0 -0.2 0.01"></a-entity>
    </a-entity>
    
    <a-ring position="-35 0.01 -35" rotation="-90 0 0" radius-inner="2" radius-outer="2.5" color="#4ECDC4"></a-ring>
    
    <!-- Blue Zone Content: Image Gallery Wall -->
    <a-entity id="blue-content" position="-35 2.5 -35" visible="false">
      <a-plane width="6" height="3.5" color="#0a0a0a" opacity="0.9"></a-plane>
      <a-entity text="value: BLUE ZONE\nImage Gallery; color: #4ECDC4; align: center; width: 5" position="0 1.3 0.01"></a-entity>
      <!-- Placeholder images (you can replace with real URLs) -->
      <a-box position="-1.5 0 0.02" width="1.2" height="1.2" depth="0.05" color="#4ECDC4"></a-box>
      <a-box position="0 0 0.02" width="1.2" height="1.2" depth="0.05" color="#6ee7d7"></a-box>
      <a-box position="1.5 0 0.02" width="1.2" height="1.2" depth="0.05" color="#8ff0e4"></a-box>
      <a-entity text="value: [Image 1]; color: #000; align: center; width: 1" position="-1.5 0 0.06"></a-entity>
      <a-entity text="value: [Image 2]; color: #000; align: center; width: 1" position="0 0 0.06"></a-entity>
      <a-entity text="value: [Image 3]; color: #000; align: center; width: 1" position="1.5 0 0.06"></a-entity>
    </a-entity>
    
    <a-sphere id="zone3" position="0 1 -60" color="#7BC8A4" radius="1.5" shadow="cast: true; receive: true"></a-sphere>
    <a-ring position="0 0.01 -60" rotation="-90 0 0" radius-inner="2" radius-outer="2.5" color="#7BC8A4"></a-ring>
    
    <!-- Green Zone Content: Interactive Buttons -->
    <a-entity id="green-content" position="0 2.5 -59" visible="false">
      <a-plane width="5" height="4" color="#0f0f0f" opacity="0.9"></a-plane>
      <a-entity text="value: GREEN ZONE\nInteractive Area; color: #7BC8A4; align: center; width: 4.5" position="0 1.5 0.01"></a-entity>
      
      <!-- Interactive buttons -->
      <a-box class="clickable interactive-btn" position="-1.2 0.3 0.02" width="1" height="0.6" depth="0.1" color="#7BC8A4" data-action="button1">
        <a-entity text="value: Button 1; color: #000; align: center; width: 1.8" position="0 0 0.06"></a-entity>
      </a-box>
      <a-box class="clickable interactive-btn" position="0 0.3 0.02" width="1" height="0.6" depth="0.1" color="#7BC8A4" data-action="button2">
        <a-entity text="value: Button 2; color: #000; align: center; width: 1.8" position="0 0 0.06"></a-entity>
      </a-box>
      <a-box class="clickable interactive-btn" position="1.2 0.3 0.02" width="1" height="0.6" depth="0.1" color="#7BC8A4" data-action="button3">
        <a-entity text="value: Button 3; color: #000; align: center; width: 1.8" position="0 0 0.06"></a-entity>
      </a-box>
      
      <a-entity id="green-message" text="value: Click a button above!; color: #FFF; align: center; width: 4" position="0 -0.5 0.01"></a-entity>
    </a-entity>
    
    <a-torus id="zone4" position="40 1 35" color="#FFE66D" radius="1.5" radius-tubular="0.3" shadow="cast: true; receive: true"></a-torus>
    <a-ring position="40 0.01 35" rotation="-90 0 0" radius-inner="2" radius-outer="2.5" color="#FFE66D"></a-ring>
    
    <!-- Yellow Zone Content: 3D Product Display -->
    <a-entity id="yellow-content" position="40 2.5 35" visible="false">
      <a-plane width="5" height="3.5" color="#1a1a0f" opacity="0.9"></a-plane>
      <a-entity text="value: YELLOW ZONE\nProduct Showcase; color: #FFE66D; align: center; width: 4.5" position="0 1.3 0.01"></a-entity>
      
      <!-- Rotating 3D object as product -->
      <a-entity position="0 0 0.5">
        <a-box width="0.8" height="0.8" depth="0.8" color="#FFE66D" 
               animation="property: rotation; to: 0 360 0; loop: true; dur: 4000"></a-box>
        <a-entity text="value: Rotating Product Demo; color: #FFF; align: center; width: 3" position="0 -0.8 0"></a-entity>
      </a-entity>
    </a-entity>
    
    <a-ring position="-40 0.01 40" rotation="-90 0 0" radius-inner="2" radius-outer="2.5" color="#FF6B9D"></a-ring>
    
    <!-- Purple Zone Content: Video/Media Area -->
    <a-entity id="purple-content" position="-40 2.5 40" visible="false">
      <a-plane width="6" height="4.5" color="#1a0a1a" opacity="0.9"></a-plane>
      <a-entity text="value: PURPLE ZONE\nVideo & Media; color: #FF6B9D; align: center; width: 5" position="0 1.8 0.01"></a-entity>
      
      <!-- YouTube Video -->
      <a-video id="purple-video" src="#video-screen" width="4.5" height="2.5" position="0 0.3 0.02"></a-video>
      
      <!-- Video Controls -->
      <a-box id="play-button" class="clickable video-control" position="-0.6 -1.3 0.02" width="1" height="0.4" depth="0.1" color="#4CAF50">
        <a-entity text="value: PLAY; color: #FFF; align: center; width: 2" position="0 0 0.06"></a-entity>
      </a-box>
      
      <a-box id="pause-button" class="clickable video-control" position="0.6 -1.3 0.02" width="1" height="0.4" depth="0.1" color="#F44336">
        <a-entity text="value: PAUSE; color: #FFF; align: center; width: 2" position="0 0 0.06"></a-entity>
      </a-box>
      
      <a-entity text="value: Click buttons to control playback; color: #FFF; align: center; width: 5" position="0 -1.9 0.01"></a-entity>
    </a-entity>
    
    <!-- Teleport Menu (in world space) -->
    <a-entity id="teleport-menu" position="0 1.5 -2">
      <!-- Center -->
      <a-ring id="menu-toggle" color="#2d2d44" radius-inner="0.1" radius-outer="0.15" class="clickable"></a-ring>
      
      <!-- Buttons -->
      <a-circle id="btn1" class="tp-btn clickable" position="0 0.5 0" radius="0.12" color="#FF6B6B" data-x="30" data-y="1.6" data-z="-40" data-zone="red">
        <a-plane id="label1" width="0.8" height="0.3" color="#000000" opacity="0.9" position="0 0.35 0.01" visible="false">
          <a-entity text="value: Red Zone; color: #FFF; align: center; width: 1.5" position="0 0 0.01"></a-entity>
        </a-plane>
      </a-circle>
      
      <a-circle id="btn2" class="tp-btn clickable" position="-0.43 0.25 0" radius="0.12" color="#4ECDC4" data-x="-35" data-y="1.6" data-z="-35" data-zone="blue">
        <a-plane id="label2" width="0.8" height="0.3" color="#000000" opacity="0.9" position="0 0.35 0.01" visible="false">
          <a-entity text="value: Blue Zone; color: #FFF; align: center; width: 1.5" position="0 0 0.01"></a-entity>
        </a-plane>
      </a-circle>
      
      <a-circle id="btn3" class="tp-btn clickable" position="-0.43 -0.25 0" radius="0.12" color="#7BC8A4" data-x="0" data-y="1.6" data-z="-60" data-zone="green">
        <a-plane id="label3" width="0.9" height="0.3" color="#000000" opacity="0.9" position="0 0.35 0.01" visible="false">
          <a-entity text="value: Green Zone; color: #FFF; align: center; width: 1.7" position="0 0 0.01"></a-entity>
        </a-plane>
      </a-circle>
      
      <a-circle id="btn4" class="tp-btn clickable" position="0.43 -0.25 0" radius="0.12" color="#FFE66D" data-x="40" data-y="1.6" data-z="35" data-zone="yellow">
        <a-plane id="label4" width="1" height="0.3" color="#000000" opacity="0.9" position="0 0.35 0.01" visible="false">
          <a-entity text="value: Yellow Zone; color: #FFF; align: center; width: 1.8" position="0 0 0.01"></a-entity>
        </a-plane>
      </a-circle>
      
      <a-circle id="btn5" class="tp-btn clickable" position="0.43 0.25 0" radius="0.12" color="#FF6B9D" data-x="-40" data-y="1.6" data-z="45" data-zone="purple">
        <a-plane id="label5" width="1" height="0.3" color="#000000" opacity="0.9" position="0 0.35 0.01" visible="false">
          <a-entity text="value: Purple Zone; color: #FFF; align: center; width: 1.8" position="0 0 0.01"></a-entity>
        </a-plane>
      </a-circle>
      
      <!-- Flying positions -->
      <a-circle class="tp-btn clickable fly-btn-3d" position="-0.7 0 0" radius="0.1" color="#9C27B0" data-x="50" data-y="20" data-z="-60" data-zone="">
        <a-plane class="fly-label" width="0.9" height="0.3" color="#000000" opacity="0.9" position="0 0.3 0.01" visible="false">
          <a-entity text="value: Mountain; color: #FFF; align: center; width: 1.7" position="0 0 0.01"></a-entity>
        </a-plane>
      </a-circle>
      
      <a-circle class="tp-btn clickable fly-btn-3d" position="0.7 0 0" radius="0.1" color="#00BCD4" data-x="0" data-y="25" data-z="0" data-zone="">
        <a-plane class="fly-label" width="0.8" height="0.3" color="#000000" opacity="0.9" position="0 0.3 0.01" visible="false">
          <a-entity text="value: Sky View; color: #FFF; align: center; width: 1.5" position="0 0 0.01"></a-entity>
        </a-plane>
      </a-circle>
    </a-entity>
    
    <!-- Lights -->
    <a-light type="ambient" color="#888"></a-light>
    <a-light type="directional" color="#FFF" intensity="0.5" position="5 10 5"></a-light>
    
    <!-- Camera -->
    <a-entity id="camera" camera position="0 1.6 0" look-controls wasd-controls="acceleration: 65">
      <a-cursor id="cursor" color="#FF0000" raycaster="objects: .clickable"></a-cursor>
      
      <!-- VR Mini Menu - Attached to camera for VR mode -->
      <a-entity id="vr-mini-menu" position="0.5 -0.4 -0.8" visible="false">
        <a-circle class="vr-mini-tp-btn clickable" position="0 0.15 0" radius="0.04" color="#FF6B6B" data-x="30" data-y="1.6" data-z="-40" data-zone="red">
          <a-entity class="vr-label" text="value: Red Zone; color: #FFF; align: center; width: 0.5" position="0 0.1 0.01" visible="false"></a-entity>
        </a-circle>
        <a-circle class="vr-mini-tp-btn clickable" position="-0.13 0.075 0" radius="0.04" color="#4ECDC4" data-x="-35" data-y="1.6" data-z="-35" data-zone="blue">
          <a-entity class="vr-label" text="value: Blue Zone; color: #FFF; align: center; width: 0.5" position="0 0.1 0.01" visible="false"></a-entity>
        </a-circle>
        <a-circle class="vr-mini-tp-btn clickable" position="-0.13 -0.075 0" radius="0.04" color="#7BC8A4" data-x="0" data-y="1.6" data-z="-60" data-zone="green">
          <a-entity class="vr-label" text="value: Green Zone; color: #FFF; align: center; width: 0.6" position="0 0.1 0.01" visible="false"></a-entity>
        </a-circle>
        <a-circle class="vr-mini-tp-btn clickable" position="0.13 -0.075 0" radius="0.04" color="#FFE66D" data-x="40" data-y="1.6" data-z="35" data-zone="yellow">
          <a-entity class="vr-label" text="value: Yellow Zone; color: #333; align: center; width: 0.6" position="0 0.1 0.01" visible="false"></a-entity>
        </a-circle>
        <a-circle class="vr-mini-tp-btn clickable" position="0.13 0.075 0" radius="0.04" color="#FF6B9D" data-x="-40" data-y="1.6" data-z="45" data-zone="purple">
          <a-entity class="vr-label" text="value: Purple Zone; color: #FFF; align: center; width: 0.6" position="0 0.1 0.01" visible="false"></a-entity>
        </a-circle>
        
        <!-- Flying positions in VR menu -->
        <a-circle class="vr-mini-tp-btn clickable" position="-0.2 -0.15 0" radius="0.035" color="#9C27B0" data-x="50" data-y="20" data-z="-60" data-zone="">
          <a-entity class="vr-label" text="value: Mountain; color: #FFF; align: center; width: 0.5" position="0 0.08 0.01" visible="false"></a-entity>
        </a-circle>
        
        <a-circle class="vr-mini-tp-btn clickable" position="0.2 -0.15 0" radius="0.035" color="#00BCD4" data-x="0" data-y="25" data-z="0" data-zone="">
          <a-entity class="vr-label" text="value: Sky View; color: #FFF; align: center; width: 0.5" position="0 0.08 0.01" visible="false"></a-entity>
        </a-circle>
        
        <a-ring color="#2d2d44" radius-inner="0.03" radius-outer="0.05"></a-ring>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    window.addEventListener('load', function() {
      var scene = document.querySelector('a-scene');
      
      scene.addEventListener('loaded', function() {
        setTimeout(function() {
          var camera = document.querySelector('#camera');
          var menu = document.querySelector('#teleport-menu');
          var hudMenu = document.querySelector('#hud-menu');
          var hudCenter = document.querySelector('#hud-center');
          var vrMiniMenu = document.querySelector('#vr-mini-menu');
          var hudButtons = document.querySelectorAll('.hud-button');
          var buttons = document.querySelectorAll('.tp-btn');
          var menuToggle = document.querySelector('#menu-toggle');
          var instructionText = document.querySelector('#instruction-text');
          var menuVisible = true;
          var miniMenuActive = false;
          var spawnPoint = {x: 0, y: 1.6, z: 0};
          var initialPosition = camera.getAttribute('position');
          var scene = document.querySelector('a-scene');
          var visitedZones = {};
          
          // Function to hide instruction text
          function hideInstructions() {
            if (instructionText && !instructionText.classList.contains('hidden')) {
              instructionText.classList.add('hidden');
              setTimeout(function() {
                instructionText.style.display = 'none';
              }, 500);
            }
          }
          
          // Detect VR mode
          scene.addEventListener('enter-vr', function() {
            hudMenu.style.display = 'none';
            if (miniMenuActive) {
              vrMiniMenu.setAttribute('visible', true);
            }
          });
          
          scene.addEventListener('exit-vr', function() {
            vrMiniMenu.setAttribute('visible', false);
            if (miniMenuActive) {
              hudMenu.style.display = 'block';
            }
          });
          
          // Function to show menus on first interaction
          function activateMiniMenu() {
            if (!miniMenuActive) {
              miniMenuActive = true;
              hudMenu.style.display = 'block';
              menu.setAttribute('visible', false);
              hideInstructions();
            }
          }
          
          // Function to position menu in front of camera
          function positionMenuInFrontOfCamera() {
            var cameraPos = camera.getAttribute('position');
            var cameraRotation = camera.getAttribute('rotation');
            
            var angle = (cameraRotation.y) * Math.PI / 180;
            var x = cameraPos.x - Math.sin(angle) * 2;
            var z = cameraPos.z - Math.cos(angle) * 2;
            var y = cameraPos.y - 0.1;
            
            menu.setAttribute('position', x + ' ' + y + ' ' + z);
            menu.setAttribute('rotation', '0 ' + cameraRotation.y + ' 0');
          }
          
          // Function to smoothly move camera to target position
          function smoothTeleport(targetX, targetY, targetZ, zoneId) {
            var currentPos = camera.getAttribute('position');
            var startX = currentPos.x;
            var startY = currentPos.y;
            var startZ = currentPos.z;
            var duration = 1000;
            var startTime = Date.now();
            
            function animate() {
              var elapsed = Date.now() - startTime;
              var progress = Math.min(elapsed / duration, 1);
              
              var eased = progress < 0.5 
                ? 2 * progress * progress 
                : 1 - Math.pow(-2 * progress + 2, 2) / 2;
              
              var newX = startX + (targetX - startX) * eased;
              var newY = startY + (targetY - startY) * eased;
              var newZ = startZ + (targetZ - startZ) * eased;
              
              camera.setAttribute('position', newX + ' ' + newY + ' ' + newZ);
              
              if (progress < 1) {
                requestAnimationFrame(animate);
              } else {
                if (zoneId) {
                  document.querySelector('#' + zoneId + '-content').setAttribute('visible', true);
                  visitedZones[zoneId] = true;
                  
                  // Rotate camera to face purple zone video screen
                  if (zoneId === 'purple') {
                    setTimeout(function() {
                      // Calculate angle to look at purple zone center
                      var lookAtX = -40;
                      var lookAtZ = 40;
                      var angle = Math.atan2(lookAtX - newX, lookAtZ - newZ) * 180 / Math.PI;
                      camera.setAttribute('rotation', {x: 0, y: angle, z: 0});
                      
                      // Start video
                      var video = document.querySelector('#video-screen');
                      if (video) {
                        video.play().catch(function(error) {
                          console.log('Video autoplay prevented:', error);
                        });
                      }
                    }, 300);
                  }
                }
                setTimeout(positionMenuInFrontOfCamera, 100);
              }
            }
            
            animate();
          }
          
          // HUD button clicks
          hudButtons.forEach(function(btn) {
            btn.addEventListener('click', function() {
              hideInstructions();
              var x = parseFloat(this.getAttribute('data-x'));
              var y = parseFloat(this.getAttribute('data-y'));
              var z = parseFloat(this.getAttribute('data-z'));
              var zone = this.getAttribute('data-zone');
              smoothTeleport(x, y, z, zone);
            });
          });
          
          // HUD center home button
          hudCenter.addEventListener('click', function() {
            hideInstructions();
            smoothTeleport(spawnPoint.x, spawnPoint.y, spawnPoint.z, null);
          });
          
          // Teleport functionality for main menu (including flying positions)
          var allTeleportButtons = document.querySelectorAll('.tp-btn');
          allTeleportButtons.forEach(function(btn, index) {
            btn.addEventListener('click', function() {
              hideInstructions();
              var x = parseFloat(this.getAttribute('data-x'));
              var y = parseFloat(this.getAttribute('data-y'));
              var z = parseFloat(this.getAttribute('data-z'));
              var zone = this.getAttribute('data-zone');
              
              activateMiniMenu();
              smoothTeleport(x, y, z, zone);
            });
            
            btn.addEventListener('mouseenter', function() {
              this.setAttribute('scale', '1.3 1.3 1.3');
              
              // Show regular labels for zone buttons
              if (index < 5) {
                var label = document.querySelector('#label' + (index + 1));
                if (label) label.setAttribute('visible', true);
              } else {
                // Show fly labels for flying buttons
                var flyLabels = this.querySelectorAll('.fly-label');
                if (flyLabels[0]) flyLabels[0].setAttribute('visible', true);
              }
            });
            
            btn.addEventListener('mouseleave', function() {
              this.setAttribute('scale', '1 1 1');
              
              // Hide regular labels
              if (index < 5) {
                var label = document.querySelector('#label' + (index + 1));
                if (label) label.setAttribute('visible', false);
              } else {
                // Hide fly labels
                var flyLabels = this.querySelectorAll('.fly-label');
                if (flyLabels[0]) flyLabels[0].setAttribute('visible', false);
              }
            });
          });
          
          // Menu toggle
          if (menuToggle) {
            menuToggle.addEventListener('click', function() {
              hideInstructions();
              menuVisible = !menuVisible;
              buttons.forEach(function(btn) {
                btn.setAttribute('visible', menuVisible);
              });
              
              activateMiniMenu();
            });
            
            menuToggle.addEventListener('mouseenter', function() {
              this.setAttribute('scale', '1.2 1.2 1.2');
            });
            
            menuToggle.addEventListener('mouseleave', function() {
              this.setAttribute('scale', '1 1 1');
            });
          }
          
          // VR mini menu button clicks
          var vrMiniButtons = document.querySelectorAll('.vr-mini-tp-btn');
          vrMiniButtons.forEach(function(btn, index) {
            btn.addEventListener('click', function() {
              hideInstructions();
              var x = parseFloat(this.getAttribute('data-x'));
              var y = parseFloat(this.getAttribute('data-y'));
              var z = parseFloat(this.getAttribute('data-z'));
              var zone = this.getAttribute('data-zone');
              smoothTeleport(x, y, z, zone);
            });
            
            btn.addEventListener('mouseenter', function() {
              this.setAttribute('scale', '1.3 1.3 1.3');
              var labels = this.querySelectorAll('.vr-label');
              if (labels[0]) labels[0].setAttribute('visible', true);
            });
            
            btn.addEventListener('mouseleave', function() {
              this.setAttribute('scale', '1 1 1');
              var labels = this.querySelectorAll('.vr-label');
              if (labels[0]) labels[0].setAttribute('visible', false);
            });
          });
          
          // Back buttons on platforms
          setTimeout(function() {
            var backButtons = document.querySelectorAll('.back-btn');
            backButtons.forEach(function(btn) {
              btn.addEventListener('click', function() {
                hideInstructions();
                var x = parseFloat(this.getAttribute('data-x'));
                var y = parseFloat(this.getAttribute('data-y'));
                var z = parseFloat(this.getAttribute('data-z'));
                smoothTeleport(x, y, z, null);
              });
              
              btn.addEventListener('mouseenter', function() {
                this.setAttribute('scale', '1.1 1.1 1.1');
              });
              
              btn.addEventListener('mouseleave', function() {
                this.setAttribute('scale', '1 1 1');
              });
            });
          }, 1000);
          
          // Interactive buttons in Green Zone
          setTimeout(function() {
            var interactiveButtons = document.querySelectorAll('.interactive-btn');
            var greenMessage = document.querySelector('#green-message');
            
            interactiveButtons.forEach(function(btn) {
              btn.addEventListener('click', function() {
                hideInstructions();
                var action = this.getAttribute('data-action');
                if (greenMessage) {
                  if (action === 'button1') {
                    greenMessage.setAttribute('text', 'value: You clicked Button 1!\nGreat choice!; color: #7BC8A4; align: center; width: 4');
                  } else if (action === 'button2') {
                    greenMessage.setAttribute('text', 'value: Button 2 activated!\nNice work!; color: #7BC8A4; align: center; width: 4');
                  } else if (action === 'button3') {
                    greenMessage.setAttribute('text', 'value: Button 3 pressed!\nAwesome!; color: #7BC8A4; align: center; width: 4');
                  }
                }
              });
              
              btn.addEventListener('mouseenter', function() {
                this.setAttribute('scale', '1.1 1.1 1.1');
              });
              
              btn.addEventListener('mouseleave', function() {
                this.setAttribute('scale', '1 1 1');
              });
            });
          }, 1000);
          
          // Video controls in Purple Zone
          setTimeout(function() {
            var playButton = document.querySelector('#play-button');
            var pauseButton = document.querySelector('#pause-button');
            var videoElement = document.querySelector('#video-screen');
            
            if (playButton && pauseButton && videoElement) {
              playButton.addEventListener('click', function() {
                hideInstructions();
                console.log('Play button clicked');
                videoElement.play().then(function() {
                  console.log('Video playing');
                }).catch(function(error) {
                  console.log('Play error:', error);
                });
              });
              
              pauseButton.addEventListener('click', function() {
                hideInstructions();
                console.log('Pause button clicked');
                videoElement.pause();
              });
              
              var videoControls = document.querySelectorAll('.video-control');
              videoControls.forEach(function(btn) {
                btn.addEventListener('mouseenter', function() {
                  this.setAttribute('scale', '1.1 1.1 1.1');
                });
                
                btn.addEventListener('mouseleave', function() {
                  this.setAttribute('scale', '1 1 1');
                });
              });
            }
          }, 2000);
          
          // Check for WASD movement
          setInterval(function() {
            var currentPos = camera.getAttribute('position');
            if (currentPos.x !== initialPosition.x || 
                currentPos.y !== initialPosition.y || 
                currentPos.z !== initialPosition.z) {
              activateMiniMenu();
              initialPosition = currentPos;
            }
            
            var zonePositions = {
              red: {x: 30, y: 1.6, z: -40},
              blue: {x: -35, y: 1.6, z: -35},
              green: {x: 0, y: 1.6, z: -60},
              yellow: {x: 40, y: 1.6, z: 35},
              purple: {x: -40, y: 1.6, z: 45}
            };
            
            Object.keys(zonePositions).forEach(function(zone) {
              var zonePos = zonePositions[zone];
              var distance = Math.sqrt(
                Math.pow(currentPos.x - zonePos.x, 2) +
                Math.pow(currentPos.y - zonePos.y, 2) +
                Math.pow(currentPos.z - zonePos.z, 2)
              );
              
              var content = document.querySelector('#' + zone + '-content');
              if (content && visitedZones[zone]) {
                content.setAttribute('visible', distance <= 15);
              }
            });
          }, 100);
        }, 500);
      });
    });
  </script>
</body>
</html>
