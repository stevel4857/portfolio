name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify LFS assets
        run: |
          for f in assets/VRVideooffice2019.mp4 assets/models/scene/scene.glb; do
            size=$(stat -c%s "$f")
            if [ "$size" -lt 1000 ]; then
              echo "::error::LFS file $f is only ${size} bytes — pointer not resolved"
              exit 1
            fi
          done

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ead271a0c44be1ef4b45796142c5e8e2
          projectName: steveknows
          directory: .
          branch: main