name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      # lfs: false — full LFS pull currently fails when the repo LFS budget is exceeded,
      # which blocked all deploys (including HTML/JSON-only updates like YouTube embeds).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Optional Git LFS pull
        continue-on-error: true
        run: |
          git lfs install
          if git lfs pull; then
            echo "LFS assets pulled successfully"
          else
            echo "::warning::Git LFS pull failed (budget or network). Deploying non-LFS files only."
          fi

      - name: Note unresolved LFS pointers
        continue-on-error: true
        run: |
          for f in assets/VRVideooffice2019.mp4 assets/models/scene/scene.glb; do
            if [ -f "$f" ]; then
              size=$(stat -c%s "$f")
              if [ "$size" -lt 1000 ]; then
                echo "::warning::LFS file $f is only ${size} bytes (pointer). Media may 404 until LFS budget is restored."
              fi
            fi
          done

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ead271a0c44be1ef4b45796142c5e8e2
          projectName: steveknows
          directory: .
          branch: main

  linkedin:
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cross-post to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          SITE_URL: https://steveknowsweb.com
        run: node scripts/post-to-linkedin.mjs

      - name: Commit LinkedIn manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/linkedin-posted.json
          if git diff --staged --quiet; then
            echo "No manifest changes."
            exit 0
          fi
          git commit -m "chore: record LinkedIn cross-post [skip ci]"
          git push